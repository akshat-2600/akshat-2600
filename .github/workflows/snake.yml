name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: akshat-2600

          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github&color_snake=%23ff4500&color_dots=%23ebedf0,%23ffd180,%23ffb74d,%23ff9800,%23ff5722

            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff6b00&color_dots=%23161b22,%23ffcc80,%23ff9800,%23ff7043,%23bf360c

            dist/github-contribution-grid-snake.gif?palette=github&color_snake=%23ff4500&color_dots=%23ebedf0,%23ffd180,%23ffb74d,%23ff9800,%23ff5722

            dist/github-contribution-grid-snake-dark.gif?palette=github-dark&color_snake=%23ff6b00&color_dots=%23161b22,%23ffcc80,%23ff9800,%23ff7043,%23bf360c

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
